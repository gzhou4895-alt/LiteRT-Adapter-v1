name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build_apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Android/src
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Set timestamp
        id: timestamp
        run: echo "NOW=$(date +'%Y%m%d_%H%M%S')" >> $GITHUB_ENV
      - name: Build
        run: ./gradlew clean assembleRelease --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ env.NOW }}
          path: |
            Android/src/app/build/outputs/apk/**/*.apk
            Android/src/app/build/outputs/bundle/**/*.aab
